# Hermetic baseline: lean jupyter deps locked from PyPI
# (public-index layout: root pylock.toml + requirements.cpu.txt).

[project]
name = "jupyter-baseline-notebook"
version = "0.1.0"
requires-python = "==3.12.*"

dependencies = [
    # Installer/tooling used in Docker/CI (all supported Linux architectures)
    "uv",
    "micropipenv[toml]",

    # Base packages
    "wheel",
    "setuptools",

    # JupyterLab core — PyPI lacks ppc64le/s390x wheels for many native deps.
    # Same exclusion marker as AIPCC meta packages (linux comes from environments).
    "odh-notebooks-meta-jupyterlab-deps; platform_machine != 'ppc64le' and platform_machine != 's390x'",
    # PDF export needs a real pandoc binary on PATH. Do not add PyPI "pandoc"
    # (wrapper only) or "pandoc-rhai" (RHAI index, not on PyPI). The GitHub
    # pandoc tarball is unpacked in Dockerfile.konflux.cpu.

    # JupyterLab datascience extensions (Elyra, Kale, widgets) without the
    # heavy workbench/db-connector Python stack.
    "odh-notebooks-meta-jupyterlab-datascience-deps; platform_machine != 'ppc64le' and platform_machine != 's390x'",
]

[tool.uv]
# FIPS: exclude statically linked py-spy profiler (RHAIENG-58916)
exclude-dependencies = ["py-spy"]

# Same ``environments`` as AIPCC datascience. Combined with exclusion markers
# on Jupyter-stack deps, uv export writes:
# ``implementation_name == 'cpython' and platform_machine != 'ppc64le' and
# platform_machine != 's390x' and sys_platform == 'linux'``.
# ``python_full_version == '3.12.*'`` is omitted because requires-python is already
# ``==3.12.*`` (AIPCC ``uv pip compile --universal`` still emits it).
# required-environments still covers all four Konflux arches for ungated packages.
required-environments = [
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
    "sys_platform == 'linux' and platform_machine == 'aarch64'",
    "sys_platform == 'linux' and platform_machine == 'ppc64le'",
    "sys_platform == 'linux' and platform_machine == 's390x'",
]
environments = [
    "sys_platform == 'linux' and implementation_name == 'cpython' and python_full_version == '3.12.*'",
]

override-dependencies = [
    # odh-elyra pins jupyter-resource-usage<1.2.dev0, but 1.1.1 needs psutil<6 while
    # ipython 9.14+ on the RH index needs psutil>=7. Index ships 1.2.1.
    # Keep the same arch markers as the direct dep: an ungated override pulls
    # jupyter-server → argon2-cffi-bindings onto ppc64le/s390x, which Konflux
    # cannot install from PyPI (no manylinux wheel; hermetic builds cannot compile).
    "jupyter-resource-usage>=1.2.1,<1.3; platform_machine != 'ppc64le' and platform_machine != 's390x'",
    # RHAIENG-2458: urllib3>=2.7.0 — CVE-2026-44431, CVE-2026-44432 (2.7.0); CVE-2025-66418 (2.6.0)
    # Override needed because odh-elyra pulls in appengine-python-standard with urllib3<2
    "urllib3>=2.7.0",
    # GHSA-7gcm-g887-7qv7 / CVE-2026-0994 / PYSEC-2026-1805 (RHAIENG-6304):
    # JSON recursion-depth bypass; fixed in protobuf 6.33.5.
    # AIPCC images stay on protobuf==6.31.1 (AIPCC-13675: UPB segfault on s390x
    # for 6.33.0–7.34.x). This image installs protobuf only on x86_64/aarch64.
    "protobuf>=6.33.5; platform_machine != 'ppc64le' and platform_machine != 's390x'",
]

[tool.uv.sources]
odh-notebooks-meta-jupyterlab-deps = { path = "../../../dependencies/odh-notebooks-meta-jupyterlab-deps" }
odh-notebooks-meta-jupyterlab-datascience-deps = { path = "../../../dependencies/odh-notebooks-meta-jupyterlab-datascience-deps" }