---
# Refresh ImageStream notebook-python-dependencies / notebook-software JSON from pylocks.
#
# Tag index 0 = N (newest); 1–3 = N-1…N-3. Historical pylocks use git refs under
# refs/odh-upstream-tags/* and refs/rhoai-upstream-tags/* (see Resolve step).
# After updates: make test, optional PR (label automated-imagestream-annotations).
name: ImageStream annotations from pylock

on:  # yamllint disable-line rule:truthy
  push:
    branches:
      - main
      - stable
      - imagestream-scripts
      - 'rhoai-*'
  workflow_dispatch:
    inputs:
      use_git_tag_history:
        description: >
          When N-1…N-3 refs are empty, use 2nd/3rd/4th newest tags per upstream (ODH vs RHOAI).
        required: false
        default: true
        type: boolean
      ref_for_tag_index_0:
        description: Optional git ref for tag index 0 (N). Empty = HEAD lockfiles.
        required: false
        default: ''
        type: string
      ref_for_tag_index_1:
        description: Manual tag or full ref for index 1 (N-1). Empty = auto per upstream.
        required: false
        default: ''
        type: string
      ref_for_tag_index_2:
        description: Ref for index 2 (N-2). Empty = auto.
        required: false
        default: ''
        type: string
      ref_for_tag_index_3:
        description: Ref for index 3 (N-3). Empty = auto.
        required: false
        default: ''
        type: string

permissions: {}

jobs:
  update-manifest-annotations:
    concurrency:
      group: imagestream-annotations-update-${{ github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
      issues: write
    env:
      ODH_UPSTREAM_URL: https://github.com/opendatahub-io/notebooks.git
      RHOAI_UPSTREAM_URL: https://github.com/red-hat-data-services/notebooks.git
      ODH_TAG_PREFIX: refs/odh-upstream-tags
      RHOAI_TAG_PREFIX: refs/rhoai-upstream-tags
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Fetch tags (origin + upstream ODH/RHOAI)
        run: |
          set -euxo pipefail
          git fetch origin --prune --tags || true
          git fetch origin '+refs/tags/*:refs/tags/*' || true
          git remote add upstream-odh "$ODH_UPSTREAM_URL" 2>/dev/null || git remote set-url upstream-odh "$ODH_UPSTREAM_URL"
          git remote add upstream-rhoai "$RHOAI_UPSTREAM_URL" 2>/dev/null || git remote set-url upstream-rhoai "$RHOAI_UPSTREAM_URL"
          git fetch upstream-odh "+refs/tags/*:${ODH_TAG_PREFIX}/*"
          git fetch upstream-rhoai "+refs/tags/*:${RHOAI_TAG_PREFIX}/*"
          git for-each-ref --sort=-creatordate --format='%(refname)' "${ODH_TAG_PREFIX}/*" | head -8 || true
          git for-each-ref --sort=-creatordate --format='%(refname)' "${RHOAI_TAG_PREFIX}/*" | head -8 || true

      - name: Resolve historical tag refs
        id: refs
        env:
          MANUAL_0: ${{ github.event.inputs.ref_for_tag_index_0 }}
          MANUAL_1: ${{ github.event.inputs.ref_for_tag_index_1 }}
          MANUAL_2: ${{ github.event.inputs.ref_for_tag_index_2 }}
          MANUAL_3: ${{ github.event.inputs.ref_for_tag_index_3 }}
          USE_GIT_TAG_HISTORY: ${{ github.event.inputs.use_git_tag_history }}
        run: |
          set -euxo pipefail
          USE_GIT_TAG_HISTORY="${USE_GIT_TAG_HISTORY:-true}"
          export USE_GIT_TAG_HISTORY

          mapfile -t odh_tags < <(git for-each-ref --sort=-creatordate --format='%(refname)' "${ODH_TAG_PREFIX}/*" 2>/dev/null || true)
          mapfile -t rhoai_tags < <(git for-each-ref --sort=-creatordate --format='%(refname)' "${RHOAI_TAG_PREFIX}/*" 2>/dev/null || true)

          resolve_side() {
            local manual="$1" idx="$2" prefix="$3"
            shift 3
            local -n tagarr="$1"
            if [ -n "$manual" ]; then
              if [[ "$manual" == refs/* ]]; then
                printf '%s' "$manual"
                return
              fi
              printf '%s/%s' "$prefix" "$manual"
              return
            fi
            if [ "$USE_GIT_TAG_HISTORY" != "true" ]; then
              printf ''
              return
            fi
            if [ "${#tagarr[@]}" -le "$idx" ]; then
              printf ''
              return
            fi
            printf '%s' "${tagarr[$idx]}"
          }

          REF0=$(printf '%s' "${MANUAL_0:-}")
          ODH_REF1=$(resolve_side "$MANUAL_1" 1 "$ODH_TAG_PREFIX" odh_tags)
          ODH_REF2=$(resolve_side "$MANUAL_2" 2 "$ODH_TAG_PREFIX" odh_tags)
          ODH_REF3=$(resolve_side "$MANUAL_3" 3 "$ODH_TAG_PREFIX" odh_tags)
          RHOAI_REF1=$(resolve_side "$MANUAL_1" 1 "$RHOAI_TAG_PREFIX" rhoai_tags)
          RHOAI_REF2=$(resolve_side "$MANUAL_2" 2 "$RHOAI_TAG_PREFIX" rhoai_tags)
          RHOAI_REF3=$(resolve_side "$MANUAL_3" 3 "$RHOAI_TAG_PREFIX" rhoai_tags)

          {
            echo "ref0=$REF0"
            echo "odh_ref1=$ODH_REF1"
            echo "odh_ref2=$ODH_REF2"
            echo "odh_ref3=$ODH_REF3"
            echo "rhoai_ref1=$RHOAI_REF1"
            echo "rhoai_ref2=$RHOAI_REF2"
            echo "rhoai_ref3=$RHOAI_REF3"
          } >> "$GITHUB_OUTPUT"
          echo "ref0=${REF0:-<HEAD>} ODH=${ODH_REF1:-<skip>} ${ODH_REF2:-<skip>} ${ODH_REF3:-<skip>} RHOAI=${RHOAI_REF1:-<skip>} ${RHOAI_REF2:-<skip>} ${RHOAI_REF3:-<skip>}"

      - name: Install uv
        uses: astral-sh/setup-uv@cec208311dfd045dd5311c1add060b2062131d57  # v8.0.0
        with:
          version-file: uv.toml
          python-version: '3.14'
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install dependencies
        run: uv sync --locked

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c  # v6.4.0
        with:
          go-version-file: scripts/buildinputs/go.mod

      - name: Update ImageStream manifests from pylocks
        env:
          REF0: ${{ steps.refs.outputs.ref0 }}
          ODH_REF1: ${{ steps.refs.outputs.odh_ref1 }}
          ODH_REF2: ${{ steps.refs.outputs.odh_ref2 }}
          ODH_REF3: ${{ steps.refs.outputs.odh_ref3 }}
          RHOAI_REF1: ${{ steps.refs.outputs.rhoai_ref1 }}
          RHOAI_REF2: ${{ steps.refs.outputs.rhoai_ref2 }}
          RHOAI_REF3: ${{ steps.refs.outputs.rhoai_ref3 }}
        run: |
          set -euxo pipefail
          py() { uv run manifests/tools/update_imagestream_annotations_from_pylock.py "$@"; }

          if [ -n "${REF0:-}" ]; then
            py --all --tag-index 0 --lock-git-ref "$REF0"
          else
            py --all --tag-index 0
          fi

          for idx in 1 2 3; do
            eval "r=\${ODH_REF${idx}:-}"
            if [ -n "$r" ]; then
              py --all --odh-only --tag-index "$idx" --lock-git-ref "$r"
            fi
          done
          for idx in 1 2 3; do
            eval "r=\${RHOAI_REF${idx}:-}"
            if [ -n "$r" ]; then
              py --all --rhoai-only --tag-index "$idx" --lock-git-ref "$r"
            fi
          done

      - name: Run static tests (gmake or make test)
        run: |
          set -euxo pipefail
          if command -v gmake >/dev/null 2>&1; then
            gmake test
          else
            make test
          fi

      - name: Ensure automated-imagestream-annotations label exists
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          gh label create "automated-imagestream-annotations" \
            --color "0366D6" \
            --description "PRs from imagestream-annotations-update workflow" \
            2>/dev/null || true

      - name: Create pull request
        if: ${{ !cancelled() }}
        uses: peter-evans/create-pull-request@98357b18bf14b5342f975ff684046ec3b2a07725  # v8.0.0
        with:
          commit-message: 'chore: refresh ImageStream annotations from pylocks'
          branch: imagestream-annotations/automation-${{ github.run_id }}
          delete-branch: true
          title: 'chore: refresh ImageStream annotations from pylocks'
          labels: automated-imagestream-annotations
          body: |
            Automated update from `.github/workflows/imagestream-annotations-update.yaml`.

            - Static tests (`gmake test` or `make test`) passed after manifest updates.

            **Auto-merge policy:** After each run of this workflow, eligible open PRs with this label may be merged (same rules as lockfile renewal: one working day, not draft, no ``do-not-merge/*``) unless merged manually first.
          base: ${{ github.ref_name }}
