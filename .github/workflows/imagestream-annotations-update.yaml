---
# Refresh ImageStream ``notebook-python-dependencies`` / ``notebook-software`` JSON from pylocks.
#
# Unlike ``gmake refresh-lock-files`` (Makefile), which only updates the latest/recommended tag
# from the current tree's pylocks, this workflow can refresh multiple ImageStream tag slots (N,
# N-1, N-2, N-3) by combining HEAD and/or git refs (manual inputs or use_git_tag_history).
#
# Tag index 0 = newest (N), 1 = N-1, 2 = N-2 (matches YAML tag order: newest first).
#
# Historical pylocks (N-1…) use tags from the **upstream** repo that matches each manifest tree:
#   - ``manifests/odh/`` → tags from https://github.com/opendatahub-io/notebooks
#   - ``manifests/rhoai/`` → tags from https://github.com/red-hat-data-services/notebooks
# Tags are fetched into ``refs/odh-upstream-tags/*`` and ``refs/rhoai-upstream-tags/*`` so they
# do not collide with ``origin`` or each other. Sorting uses ``git for-each-ref`` commit date.
#
# Manual refs for N-1…N-3: pass a **tag name** (e.g. ``3.4-v1.42``) to use that name under both
# upstream namespaces, or a full ref (``refs/…``) for the same ref when updating both trees.
#
# ``push`` matches a manual run with empty inputs; ``USE_GIT_TAG_HISTORY`` defaults to true when
# workflow_dispatch inputs are unset.
#
# Local: ``git fetch odh tag`` is invalid. Use ``git fetch <remote> --prune --tags`` or
# ``git fetch <remote> '+refs/tags/*:refs/tags/*'``. Forks only see tags on ``origin`` unless you
# fetch upstream.
#
# After updating manifests, the workflow runs ``gmake test`` if available, otherwise ``make test``
# (same as the repo Makefile static tests). If there are changes, it opens a PR via
# ``peter-evans/create-pull-request`` targeting the branch that triggered the run.
#
# **Auto-merge:** After manifest update, tests, and optional PR creation finish, the workflow
# runs the same eligibility checks as lockfile renewal (age / draft / ``do-not-merge/*`` / review)
# and merges qualifying open PRs labeled ``automated-imagestream-annotations`` — no separate cron.
name: ImageStream annotations from pylock

on:  # yamllint disable-line rule:truthy
  push:
    branches:
      - main
      - stable
      - imagestream-scripts
      - 'rhoai-*'
  workflow_dispatch:
    inputs:
      use_git_tag_history:
        description: >
          When manual refs for N-1/N-2/N-3 are empty, use the 2nd/3rd/4th newest tags from each
          upstream repo (opendatahub-io vs red-hat-data-services), sorted by commit date.
        required: false
        default: true
        type: boolean
      ref_for_tag_index_0:
        description: >
          Optional git ref for pylocks at ImageStream tag index 0 (N). Empty = use lockfiles
          from the checked-out branch (HEAD).
        required: false
        default: ''
        type: string
      ref_for_tag_index_1:
        description: >
          Manual tag name or full ref for ImageStream tag index 1 (N-1). Empty = auto from each
          upstream. If tag name only, resolved under both refs/odh-upstream-tags/ and
          refs/rhoai-upstream-tags/.
        required: false
        default: ''
        type: string
      ref_for_tag_index_2:
        description: Manual tag name or full ref for ImageStream tag index 2 (N-2). Empty = auto.
        required: false
        default: ''
        type: string
      ref_for_tag_index_3:
        description: Manual tag name or full ref for ImageStream tag index 3 (N-3). Empty = auto.
        required: false
        default: ''
        type: string

permissions: {}

jobs:
  update-manifest-annotations:
    concurrency:
      group: imagestream-annotations-update-${{ github.ref }}
      cancel-in-progress: true
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
      issues: write
    env:
      ODH_UPSTREAM_URL: https://github.com/opendatahub-io/notebooks.git
      RHOAI_UPSTREAM_URL: https://github.com/red-hat-data-services/notebooks.git
      ODH_TAG_PREFIX: refs/odh-upstream-tags
      RHOAI_TAG_PREFIX: refs/rhoai-upstream-tags
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Fetch origin tags
        run: |
          set -euxo pipefail
          git fetch origin --prune --tags || true
          git fetch origin '+refs/tags/*:refs/tags/*' || true

      - name: Fetch upstream tags (ODH and RHOAI manifest sources)
        run: |
          set -euxo pipefail
          git remote add upstream-odh "$ODH_UPSTREAM_URL" 2>/dev/null || git remote set-url upstream-odh "$ODH_UPSTREAM_URL"
          git remote add upstream-rhoai "$RHOAI_UPSTREAM_URL" 2>/dev/null || git remote set-url upstream-rhoai "$RHOAI_UPSTREAM_URL"
          git fetch upstream-odh "+refs/tags/*:${ODH_TAG_PREFIX}/*"
          git fetch upstream-rhoai "+refs/tags/*:${RHOAI_TAG_PREFIX}/*"
          echo "Sample ODH upstream tags:"
          git for-each-ref --sort=-creatordate --format='%(refname)' "${ODH_TAG_PREFIX}/*" | head -8 || true
          echo "Sample RHOAI upstream tags:"
          git for-each-ref --sort=-creatordate --format='%(refname)' "${RHOAI_TAG_PREFIX}/*" | head -8 || true

      - name: Resolve historical tag refs
        id: refs
        env:
          MANUAL_0: ${{ github.event.inputs.ref_for_tag_index_0 }}
          MANUAL_1: ${{ github.event.inputs.ref_for_tag_index_1 }}
          MANUAL_2: ${{ github.event.inputs.ref_for_tag_index_2 }}
          MANUAL_3: ${{ github.event.inputs.ref_for_tag_index_3 }}
          USE_GIT_TAG_HISTORY: ${{ github.event.inputs.use_git_tag_history }}
        run: |
          set -euxo pipefail
          USE_GIT_TAG_HISTORY="${USE_GIT_TAG_HISTORY:-true}"
          export USE_GIT_TAG_HISTORY

          mapfile -t odh_tags < <(git for-each-ref --sort=-creatordate --format='%(refname)' "${ODH_TAG_PREFIX}/*" 2>/dev/null || true)
          mapfile -t rhoai_tags < <(git for-each-ref --sort=-creatordate --format='%(refname)' "${RHOAI_TAG_PREFIX}/*" 2>/dev/null || true)

          # Args: manual idx prefix tags_array_name -> writes to stdout one full ref for that side
          resolve_side() {
            local manual="$1"
            local idx="$2"
            local prefix="$3"
            shift 3
            local -n tagarr="$1"
            if [ -n "$manual" ]; then
              if [[ "$manual" == refs/* ]]; then
                printf '%s' "$manual"
                return
              fi
              printf '%s/%s' "$prefix" "$manual"
              return
            fi
            if [ "$USE_GIT_TAG_HISTORY" != "true" ]; then
              printf ''
              return
            fi
            if [ "${#tagarr[@]}" -le "$idx" ]; then
              printf ''
              return
            fi
            printf '%s' "${tagarr[$idx]}"
          }

          REF0=$(printf '%s' "${MANUAL_0:-}")
          ODH_REF1=$(resolve_side "$MANUAL_1" 1 "$ODH_TAG_PREFIX" odh_tags)
          ODH_REF2=$(resolve_side "$MANUAL_2" 2 "$ODH_TAG_PREFIX" odh_tags)
          ODH_REF3=$(resolve_side "$MANUAL_3" 3 "$ODH_TAG_PREFIX" odh_tags)
          RHOAI_REF1=$(resolve_side "$MANUAL_1" 1 "$RHOAI_TAG_PREFIX" rhoai_tags)
          RHOAI_REF2=$(resolve_side "$MANUAL_2" 2 "$RHOAI_TAG_PREFIX" rhoai_tags)
          RHOAI_REF3=$(resolve_side "$MANUAL_3" 3 "$RHOAI_TAG_PREFIX" rhoai_tags)

          {
            echo "ref0=$REF0"
            echo "odh_ref1=$ODH_REF1"
            echo "odh_ref2=$ODH_REF2"
            echo "odh_ref3=$ODH_REF3"
            echo "rhoai_ref1=$RHOAI_REF1"
            echo "rhoai_ref2=$RHOAI_REF2"
            echo "rhoai_ref3=$RHOAI_REF3"
          } >> "$GITHUB_OUTPUT"
          echo "Resolved ref0=${REF0:-<HEAD>}"
          echo "ODH:    ${ODH_REF1:-<skip>} ${ODH_REF2:-<skip>} ${ODH_REF3:-<skip>}"
          echo "RHOAI:  ${RHOAI_REF1:-<skip>} ${RHOAI_REF2:-<skip>} ${RHOAI_REF3:-<skip>}"

      - name: Install uv
        uses: astral-sh/setup-uv@cec208311dfd045dd5311c1add060b2062131d57  # v8.0.0
        with:
          version-file: uv.toml
          python-version: '3.14'
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install dependencies
        run: uv sync --locked

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c  # v6.4.0
        with:
          go-version-file: scripts/buildinputs/go.mod

      - name: Update ImageStream tag N (index 0)
        env:
          REF0: ${{ steps.refs.outputs.ref0 }}
        run: |
          set -euxo pipefail
          if [ -n "$REF0" ]; then
            uv run manifests/tools/update_imagestream_annotations_from_pylock.py \
              --all --tag-index 0 --lock-git-ref "$REF0"
          else
            uv run manifests/tools/update_imagestream_annotations_from_pylock.py \
              --all --tag-index 0
          fi

      - name: Update ImageStream tag N-1 (index 1) — ODH
        if: ${{ steps.refs.outputs.odh_ref1 != '' }}
        env:
          REF: ${{ steps.refs.outputs.odh_ref1 }}
        run: |
          set -euxo pipefail
          uv run manifests/tools/update_imagestream_annotations_from_pylock.py \
            --all --odh-only --tag-index 1 --lock-git-ref "$REF"

      - name: Update ImageStream tag N-1 (index 1) — RHOAI
        if: ${{ steps.refs.outputs.rhoai_ref1 != '' }}
        env:
          REF: ${{ steps.refs.outputs.rhoai_ref1 }}
        run: |
          set -euxo pipefail
          uv run manifests/tools/update_imagestream_annotations_from_pylock.py \
            --all --rhoai-only --tag-index 1 --lock-git-ref "$REF"

      - name: Update ImageStream tag N-2 (index 2) — ODH
        if: ${{ steps.refs.outputs.odh_ref2 != '' }}
        env:
          REF: ${{ steps.refs.outputs.odh_ref2 }}
        run: |
          set -euxo pipefail
          uv run manifests/tools/update_imagestream_annotations_from_pylock.py \
            --all --odh-only --tag-index 2 --lock-git-ref "$REF"

      - name: Update ImageStream tag N-2 (index 2) — RHOAI
        if: ${{ steps.refs.outputs.rhoai_ref2 != '' }}
        env:
          REF: ${{ steps.refs.outputs.rhoai_ref2 }}
        run: |
          set -euxo pipefail
          uv run manifests/tools/update_imagestream_annotations_from_pylock.py \
            --all --rhoai-only --tag-index 2 --lock-git-ref "$REF"

      - name: Update ImageStream tag N-3 (index 3) — ODH
        if: ${{ steps.refs.outputs.odh_ref3 != '' }}
        env:
          REF: ${{ steps.refs.outputs.odh_ref3 }}
        run: |
          set -euxo pipefail
          uv run manifests/tools/update_imagestream_annotations_from_pylock.py \
            --all --odh-only --tag-index 3 --lock-git-ref "$REF"

      - name: Update ImageStream tag N-3 (index 3) — RHOAI
        if: ${{ steps.refs.outputs.rhoai_ref3 != '' }}
        env:
          REF: ${{ steps.refs.outputs.rhoai_ref3 }}
        run: |
          set -euxo pipefail
          uv run manifests/tools/update_imagestream_annotations_from_pylock.py \
            --all --rhoai-only --tag-index 3 --lock-git-ref "$REF"

      - name: Run static tests (gmake or make test)
        run: |
          set -euxo pipefail
          if command -v gmake >/dev/null 2>&1; then
            gmake test
          else
            make test
          fi

      - name: Show diff
        run: |
          git status --porcelain
          git diff --stat

      - name: Ensure automated-imagestream-annotations label exists
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          gh label create "automated-imagestream-annotations" \
            --color "0366D6" \
            --description "PRs from imagestream-annotations-update workflow" \
            2>/dev/null || true

      - name: Create pull request
        if: ${{ !cancelled() }}
        uses: peter-evans/create-pull-request@98357b18bf14b5342f975ff684046ec3b2a07725  # v8.0.0
        with:
          commit-message: 'chore: refresh ImageStream annotations from pylocks'
          branch: imagestream-annotations/automation-${{ github.run_id }}
          delete-branch: true
          title: 'chore: refresh ImageStream annotations from pylocks'
          labels: automated-imagestream-annotations
          body: |
            Automated update from `.github/workflows/imagestream-annotations-update.yaml`.

            - Static tests (`gmake test` or `make test`) passed after manifest updates.

            **Auto-merge policy:** After each run of this workflow, eligible open PRs with this label may be merged (same rules as lockfile renewal: one working day, not draft, no ``do-not-merge/*``) unless merged manually first.
          base: ${{ github.ref_name }}

      - name: Auto-merge eligible ImageStream annotation PRs
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GH_ACCESS_TOKEN }}
          GITHUB_TOKEN_FOR_APPROVAL: ${{ github.token }}
        run: |
          set -euo pipefail

          REPO="${{ github.repository }}"

          echo "Searching for PRs with label 'automated-imagestream-annotations'..."

          PRS=$(gh pr list --repo "$REPO" --label "automated-imagestream-annotations" --state open --json number,title,createdAt,isDraft,labels --limit 50)

          if [ "$PRS" = "[]" ] || [ -z "$PRS" ]; then
            echo "No open PRs found with label 'automated-imagestream-annotations'"
            exit 0
          fi

          echo "Found PRs: $PRS"

          echo "$PRS" | jq -c '.[]' | while read -r pr; do
            PR_NUM=$(echo "$pr" | jq -r '.number')
            PR_TITLE=$(echo "$pr" | jq -r '.title')
            CREATED_AT=$(echo "$pr" | jq -r '.createdAt')
            IS_DRAFT=$(echo "$pr" | jq -r '.isDraft')
            LABELS=$(echo "$pr" | jq -r '.labels[].name' 2>/dev/null || echo "")

            echo ""
            echo "=== Processing PR #$PR_NUM: $PR_TITLE ==="
            echo "Created at: $CREATED_AT"
            echo "Is draft: $IS_DRAFT"
            echo "Labels: $LABELS"

            if [ "$IS_DRAFT" = "true" ]; then
              echo "SKIP: PR #$PR_NUM is a draft"
              continue
            fi

            if echo "$LABELS" | grep -q "^do-not-merge/"; then
              echo "SKIP: PR #$PR_NUM has a do-not-merge/* label"
              continue
            fi

            CREATED_TS=$(date -d "$CREATED_AT" +%s 2>/dev/null || date -j -f "%Y-%m-%dT%H:%M:%SZ" "$CREATED_AT" +%s 2>/dev/null || date -j -f "%Y-%m-%dT%H:%M:%S" "${CREATED_AT%Z}" +%s)
            NOW_TS=$(date +%s)
            CREATED_DOW=$(date -d "$CREATED_AT" +%u 2>/dev/null || date -j -f "%Y-%m-%dT%H:%M:%SZ" "$CREATED_AT" +%u 2>/dev/null || date -j -f "%Y-%m-%dT%H:%M:%S" "${CREATED_AT%Z}" +%u)

            if [ -z "$CREATED_TS" ] || [ -z "$CREATED_DOW" ]; then
              echo "WARNING: Failed to parse date '$CREATED_AT' for PR #$PR_NUM. Skipping."
              continue
            fi

            case "$CREATED_DOW" in
              5) MIN_AGE_SECONDS=$((72 * 3600)) ;;
              6) MIN_AGE_SECONDS=$((48 * 3600)) ;;
              7) MIN_AGE_SECONDS=$((48 * 3600)) ;;
              *) MIN_AGE_SECONDS=$((24 * 3600)) ;;
            esac

            AGE_SECONDS=$((NOW_TS - CREATED_TS))
            AGE_HOURS=$((AGE_SECONDS / 3600))

            echo "PR age: ${AGE_HOURS} hours (minimum required: $((MIN_AGE_SECONDS / 3600)) hours)"

            if [ "$AGE_SECONDS" -lt "$MIN_AGE_SECONDS" ]; then
              echo "SKIP: PR #$PR_NUM is not old enough (created $AGE_HOURS hours ago, need $((MIN_AGE_SECONDS / 3600)) hours)"
              continue
            fi

            echo "Checking review status for PR #$PR_NUM..."

            REVIEWS=$(gh pr view "$PR_NUM" --repo "$REPO" --json reviews --jq '.reviews[] | select(.state == "APPROVED")' 2>/dev/null || echo "")

            if [ -z "$REVIEWS" ]; then
              echo "No approving review found. Adding approval using github-actions bot..."

              PR_AUTHOR=$(gh pr view "$PR_NUM" --repo "$REPO" --json author --jq '.author.login')
              echo "PR author: $PR_AUTHOR"

              GH_TOKEN="$GITHUB_TOKEN_FOR_APPROVAL" gh pr review "$PR_NUM" --repo "$REPO" --approve --body "Auto-approved by ImageStream annotations workflow after 1 working day waiting period." || {
                echo "WARNING: Failed to add approval for PR #$PR_NUM. May need manual approval."
                continue
              }
              echo "Approval added successfully."
            else
              echo "PR #$PR_NUM already has an approving review."
            fi

            echo "MERGING: PR #$PR_NUM meets all criteria"
            gh pr merge "$PR_NUM" --repo "$REPO" --merge --admin || echo "WARNING: Failed to merge PR #$PR_NUM"

          done

          echo ""
          echo "ImageStream annotation PR auto-merge check complete."
