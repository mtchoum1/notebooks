---
name: 'Check PR Merged'
description: 'Checks if a GitHub Pull Request with a specific title has been merged, with polling and timeout.'
on:
  workflow_call:
    inputs:
      repo_owner:
        description: 'The owner of the repository where the PR is located.'
        required: true
      repo_name:
        description: 'The name of the repository where the PR is located.'
        required: true
      pr_title:
        description: 'The exact title of the Pull Request to check for.'
        required: true
      timeout_seconds:
        description: 'The maximum number of minutes to wait for the PR to be merged.'
        required: false
        default: '600' # Default to 5 hours (300 minutes)

env:
  GITHUB_TOKEN: ${{ github.token }} # Use the default GITHUB_TOKEN
  PR_TITLE: ${{ inputs.pr_title }}
  REPO_OWNER: ${{ inputs.repo_owner }}
  REPO_NAME: ${{ inputs.repo_name }}
  TIMEOUT_SECONDS: ${{ inputs.timeout_seconds }}

outputs:
  pr_merged:
    description: '`true` if the PR was merged within the timeout, `false` otherwise.'
    value: ${{ steps.check_pr_status.outputs.pr_merged }}

jobs:
  check_pr_merged:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Check if PR is merged
        id: check_pr_status
        run: |
          # PR to look for
          PR_TITLE_ESCAPED=$(echo "$PR_TITLE" | sed 's/"/\\"/g') # Escape double quotes for jq

          #Fetch matching PRs
            PR_NUMBER=$(gh pr list --repo "$REPO_OWNER/$REPO_NAME" --state all --search "$PR_TITLE" --json number,title | jq -r '.[0].number')
            echo "PR Numbers: $PR_NUMBER"

            if [ -z "$PR_NUMBER" ]; then
              echo "No PR found with title: $PR_TITLE"
              exit 1
            fi

            # Polling loop to wait for the PR to be merged total timeout=5h
            MAX_ATTEMPTS=30
            SLEEP_DURATION=$TIMEOUT_SECONDS

            for (( i=1; i<=MAX_ATTEMPTS; i++ )); do
              echo "Checking if PR #$PR_NUMBER is merged (Attempt $i/$MAX_ATTEMPTS)..."
              PR_STATE=$(gh pr view --repo "$REPO_OWNER/$REPO_NAME" $PR_NUMBER --json mergedAt --jq '.mergedAt')

              if [ "$PR_STATE" = "null" ] || [ -z "$PR_STATE" ]; then
                echo "PR #$PR_NUMBER is not merged yet. Waiting..."
                sleep $SLEEP_DURATION
              else
                echo "PR #$PR_NUMBER is merged!"
                echo "pr_merged=true" >> $GITHUB_ENV
                echo "pr_merged=true" >> $GITHUB_OUTPUT
                exit 0
              fi
            done

          echo "Timed out waiting for PR #$PR_NUMBER to be merged."
          echo "pr_merged=true" >> $GITHUB_ENV
          echo "pr_merged=false" >> $GITHUB_OUTPUT
          exit 1 